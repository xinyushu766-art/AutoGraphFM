services:
  postgres:
    image: postgres:16-alpine
    container_name: autogfm-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${AUTOGFM_POSTGRES_DB}
      POSTGRES_USER: ${AUTOGFM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTOGFM_POSTGRES_PASSWORD}
    ports:
      - "${AUTOGFM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - autogfm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AUTOGFM_POSTGRES_USER} -d ${AUTOGFM_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  autogfm_postgres_data:
