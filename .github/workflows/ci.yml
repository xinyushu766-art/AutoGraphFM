name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Run graph and model tests
        run: pytest -q tests/graph tests/test_*.py

      - name: Run data, forecasting, and pipeline tests
        run: >-
          pytest -q
          tests/database
          tests/forecasting
          tests/monitoring
          tests/pipeline
          tests/realdata
          tests/reporting
